name: Daily carousel

on:
  # EN PAUSE : retirer les deux « # » ci-dessous pour relancer la publication quotidienne.
  # schedule:
  #   - cron: "23 16 * * *"   # tous les jours à 16h23 UTC (17h23 à Paris en hiver)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
    inputs:
      publish:
        description: "Publier sur Instagram"
        type: boolean
        default: false

permissions:
  contents: write             # pour enregistrer posts/ et data/history.json

concurrency: daily-carousel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate carousel
        id: generate
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python run_daily.py

      - name: Save slides and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts data/history.json
          git diff --cached --quiet || git commit -m "Carousel du $(date -u +%F)"
          git push

      - name: Publish to Instagram
        if: github.event_name == 'schedule' || inputs.publish
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python instagram.py "${{ steps.generate.outputs.post_dir }}"
